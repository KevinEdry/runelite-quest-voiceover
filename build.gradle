plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion

	implementation('com.googlecode.soundlibs:jlayer:1.0.1.4') {
		exclude group: 'junit'
	}
	implementation 'org.xerial:sqlite-jdbc:3.46.0.0'
}

group = 'com.quest.voiceover'
version = '1.13.0' // x-release-please-version

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('runClient', JavaExec) {
	group = 'application'
	description = 'Launch RuneLite with the Quest Voiceover plugin for manual testing'
	classpath = sourceSets.test.runtimeClasspath
	mainClass.set('com.quest.voiceover.QuestVoiceoverPluginTest')
	jvmArgs = ['-ea']
}

task generateVersionProperties {
	def propertiesFile = file("$buildDir/resources/main/com/quest/voiceover/version.properties")
	outputs.file(propertiesFile)
	doLast {
		propertiesFile.parentFile.mkdirs()
		propertiesFile.text = "version=${project.version}"
	}
}

processResources.dependsOn generateVersionProperties