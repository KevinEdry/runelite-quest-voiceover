name: Rebuild database

# quest_voiceover_v2.db is a derived artifact built from the per-quest shards in db/rows/.
# Whenever a shard lands on the database branch, rebuild the blob so the file the plugin
# downloads stays in sync. Only shard changes trigger this; the resulting .db commit does
# not touch db/rows/, so it cannot retrigger the workflow.
on:
  push:
    branches: [database]
    paths:
      - "db/rows/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-database
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: database

      - uses: oven-sh/setup-bun@v2

      # Rebuild and push, retrying if another merge moves the database branch underneath us.
      # Each attempt re-syncs to the latest database (picking up any concurrently merged
      # shard) and rebuilds from scratch, so the result is always correct regardless of the
      # race. Commits are gated on the deterministic row checksum, not the non-reproducible
      # .db bytes, so an unchanged row set is a genuine no-op.
      - name: Rebuild and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin database
            git reset --hard origin/database
            bun scripts/rebuild-db.ts
            git add quest_voiceover_v2.db quest_voiceover_v2.db.sha256
            if git diff --cached --quiet -- quest_voiceover_v2.db.sha256; then
              echo "Row set unchanged; nothing to commit."
              exit 0
            fi
            git commit -m "chore: rebuild quest_voiceover_v2.db from row shards"
            if git push origin HEAD:database; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (database branch moved); re-syncing and retrying..."
            sleep $((RANDOM % 5 + 3))
          done
          echo "Failed to push after 5 attempts."
          exit 1
